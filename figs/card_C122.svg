   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #a1a1a6" x="28.8" y="58.32" transform="rotate(-0 28.8 58.32)">Chapter 6 — Modulators · Sec. 6.8 Listings 6.8-6.10 (book p. 247)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="100.8" transform="rotate(-0 68.4 100.8)">Listings 6.8-6.10: paired TCAD scripts for a pn-junction modulator.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="136.8" transform="rotate(-0 68.4 136.8)">Setup script fixes geometry: 0.5 um rib, 90 nm slab, doping implants.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="172.8" transform="rotate(-0 68.4 172.8)">DEVICE step: solves carriers vs bias, exports charge, reads C and R.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="208.8" transform="rotate(-0 68.4 208.8)">MODE step: loads that charge into optics to get n_eff vs voltage.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="244.8" transform="rotate(-0 68.4 244.8)">Result feeds INTERCONNECT: a compact modulator model from physics.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #30d158" x="46.8" y="362.16" transform="rotate(-0 46.8 362.16)">Takeaway: DEVICE electrics + MODE optics gives voltage-driven index.</text>
   </g>
