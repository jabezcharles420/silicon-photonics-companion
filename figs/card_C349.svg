   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="28.8" y="40.922449" transform="rotate(-0 28.8 40.922449)">C349 · 8.6 Alternative light sources</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #a1a1a6" x="28.8" y="60.788571" transform="rotate(-0 28.8 60.788571)">Chapter 8 — Lasers · Sec. 8.6 (book p. 306)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="105.869388" transform="rotate(-0 68.4 105.869388)">(1) Optically pumped Raman lasers — driven by light rather than by current [49].</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="145.601633" transform="rotate(-0 68.4 145.601633)">(2) Silicon nano-crystals, embedded in the silicon waveguide, used as gain material [50].</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="185.333878" transform="rotate(-0 68.4 185.333878)">(3) Black-body radiation: a hot piece of silicon waveguide will emit light [51].</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="225.066122" transform="rotate(-0 68.4 225.066122)">At typical on-chip temperatures its emission peaks at wavelengths beyond 2 µm.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="264.798367" transform="rotate(-0 68.4 264.798367)">Can be used for spectroscopy, particularly for long-wavelength integrated photonics [52].</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="304.530612" transform="rotate(-0 68.4 304.530612)">Related: surface plasmon-polaritons [53] may be useful for compact lasers on silicon.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #30d158" x="46.8" y="371.769796" transform="rotate(-0 46.8 371.769796)">Takeaway: a few other light-source options have been researched, each pointed to by a reference.</text>
   </g>
  </g>
 </g>
