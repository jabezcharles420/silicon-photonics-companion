   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="28.8" y="40.922449" transform="rotate(-0 28.8 40.922449)">C442 · Chapter 12 references</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #a1a1a6" x="28.8" y="60.788571" transform="rotate(-0 28.8 60.788571)">Chapter 12 — Testing and packaging · References [1]–[38] (book p. 404)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="105.869388" transform="rotate(-0 68.4 105.869388)">Chapter 12 ends with 38 numbered references, cited in the text as [1] to [38].</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="145.601633" transform="rotate(-0 68.4 145.601633)">Fibre-to-chip coupling: grating couplers, tapered edge couplers, polarization splitters.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="185.333878" transform="rotate(-0 68.4 185.333878)">Platforms and test uses: CMOS photonics platforms, ePIX-fab, biosensors, fibre-taper probes.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="225.066122" transform="rotate(-0 68.4 225.066122)">Vendor web pages (accessed 2014): fibre arrays, probes, probe cards, wire bonders, design tools.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="264.798367" transform="rotate(-0 68.4 264.798367)">Packaging: flip-chip vs wire-bond, two packaging textbooks, silicon photonics packaging papers.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="304.530612" transform="rotate(-0 68.4 304.530612)">Also: the automated probe station page (siepic.ubc.ca), a modulator and a resonator paper.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="344.262857" transform="rotate(-0 68.4 344.262857)">Each entry ends with “cit. on p. …” — the book pages where it is cited.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #30d158" x="46.8" y="411.502041" transform="rotate(-0 46.8 411.502041)">Takeaway: use the list to trace a Chapter 12 claim to its source; web links date from 2014.</text>
   </g>
  </g>
