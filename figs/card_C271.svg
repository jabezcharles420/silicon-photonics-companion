   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="28.8" y="39.6" transform="rotate(-0 28.8 39.6)">C271 · Chapter 2 references and chapter close</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #a1a1a6" x="28.8" y="58.32" transform="rotate(-0 28.8 58.32)">Chapter 2 — Modelling and design approaches · References (book p. 43)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="100.8" transform="rotate(-0 68.4 100.8)">Chapter 2 cites 62 sources; most are software or vendor web pages (accessed 2014).</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="136.8" transform="rotate(-0 68.4 136.8)">Design methodology [1]; mode-solver tools and algorithms [2-11].</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="172.8" transform="rotate(-0 68.4 172.8)">FDTD textbooks, papers and software such as Lumerical FDTD and MEEP [12-20].</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="208.8" transform="rotate(-0 68.4 208.8)">Scattering-matrix, 2.5D FDTD and effective-index-method sources [21-28].</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="244.8" transform="rotate(-0 68.4 244.8)">Propagation tools [29-30]; TCAD, microwave-EM and multiphysics tools [31-39].</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="280.8" transform="rotate(-0 68.4 280.8)">Circuit-modelling methods and tools [40-49]; layout and verification tools [50-62].</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #30d158" x="46.8" y="362.16" transform="rotate(-0 46.8 362.16)">Takeaway: the list is largely a directory of the simulation and layout tools in Chapter 2.</text>
   </g>
