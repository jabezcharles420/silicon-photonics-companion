   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="28.8" y="40.922449" transform="rotate(-0 28.8 40.922449)">C441 · 12.3.3 Design review and checklist</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #a1a1a6" x="28.8" y="60.788571" transform="rotate(-0 28.8 60.788571)">Chapter 12 — Testing and packaging · Sec. 12.3.3 (book pp. 402–403)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="105.869388" transform="rotate(-0 68.4 105.869388)">Reviewing a design before manufacturing is standard practice; a checklist is useful for it.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="145.601633" transform="rotate(-0 68.4 145.601633)">Manufacturability: DRC (error) clean, with exclusions explained? Has the design been tiled?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="185.333878" transform="rotate(-0 68.4 185.333878)">Manufacturability (cont.): works for known process variations? avoids a lot of minimum features? fallbacks?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="225.066122" transform="rotate(-0 68.4 225.066122)">Mask layout: waveguides connected, with appropriate radius? space-efficient? low loss? .gds cell names correct?</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="264.798367" transform="rotate(-0 68.4 264.798367)">Post-processing: any necessary alignment markers for later lithography? room to release suspended structures?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="304.530612" transform="rotate(-0 68.4 304.530612)">Optical IO: edge couplers tapered? edge or vertical probing? fibre array or single fibre, and is the pitch ok?</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="344.262857" transform="rotate(-0 68.4 344.262857)">Optical IO: are IOs interfering? can the microscope see the alignment, or will a fibre or probe block it?</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="383.995102" transform="rotate(-0 68.4 383.995102)">Electrical IO: which IOs are RF, which DC? are their impedance, trace length, etc. ok?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="423.727347" transform="rotate(-0 68.4 423.727347)">Electrical IO: probed only, wirebonded only, or both? Pad pitch/area OK?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="463.459592" transform="rotate(-0 68.4 463.459592)">Testing: standalone, or wirebonded to another device (e.g. a TIA)? can all signals be probed?</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="503.191837" transform="rotate(-0 68.4 503.191837)">Testing: if DC pads are wirebonded and RF pads probed, could a probe possibly land on bond wires?</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="542.924082" transform="rotate(-0 68.4 542.924082)">Testing: are there optical test structures that the automated probe station can measure?</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="582.656327" transform="rotate(-0 68.4 582.656327)">Packaging: will it be packaged? IO spacing and packaging rules (e.g. chip-edge offsets) met?</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #30d158" x="46.8" y="649.89551" transform="rotate(-0 46.8 649.89551)">Takeaway: the book’s example list — answer each question, then sign off (date, designer, signature).</text>
   </g>
  </g>
 </g>
