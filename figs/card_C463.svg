   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="28.8" y="40.922449" transform="rotate(-0 28.8 40.922449)">C463 · Chapter 13 references</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #a1a1a6" x="28.8" y="60.788571" transform="rotate(-0 28.8 60.788571)">Chapter 13 — Silicon photonic system example · References [1]–[11] (book p. 412)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="105.869388" transform="rotate(-0 68.4 105.869388)">Chapter 13 ends with 11 numbered references, cited in the text as [1] to [11].</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="145.601633" transform="rotate(-0 68.4 145.601633)">[1] Liu et al. (OFC 2014) on microring WDM transmitters is cited on book pp. 406–412.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="185.333878" transform="rotate(-0 68.4 185.333878)">Modulators: silicon ring modulators, carrier-injection microrings, a slow-light MZM.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="225.066122" transform="rotate(-0 68.4 225.066122)">Lasers: high-speed modulation of VCSELs (vertical-cavity surface-emitting lasers).</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="264.798367" transform="rotate(-0 68.4 264.798367)">Keeping rings on wavelength: thermally tunable WDM resonators, integrated thermal stabilization.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="304.530612" transform="rotate(-0 68.4 304.530612)">WDM links: a CMOS WDM transmitter with off-chip lasers, and comb-laser driven WDM.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="344.262857" transform="rotate(-0 68.4 344.262857)">Platform and mux: a 25 Gb/s silicon photonics platform, a tunable 1x4 wavelength (de)mux.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="383.995102" transform="rotate(-0 68.4 383.995102)">Each entry ends with “cit. on p. …” — the book pages where it is cited.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #30d158" x="46.8" y="451.234286" transform="rotate(-0 46.8 451.234286)">Takeaway: start with [1] to read the original transmitter work that Chapter 13 draws on.</text>
   </g>
  </g>
