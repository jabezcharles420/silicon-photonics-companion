   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="28.8" y="39.6" transform="rotate(-0 28.8 39.6)">C269 · 2.7 Physical layout: mask-layout tools and the book's layout flow</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #a1a1a6" x="28.8" y="58.32" transform="rotate(-0 28.8 58.32)">Chapter 2 — Modelling and design approaches · Sec. 2.7 Physical layout (book p. 41)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="100.8" transform="rotate(-0 68.4 100.8)">Many mask-layout tools exist, for electronics, MEMS, photonics and other uses.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="132.48" transform="rotate(-0 68.4 132.48)">Open source: KLayout, primarily focused on polygon-based graphical editing.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="164.16" transform="rotate(-0 68.4 164.16)">Python or MATLAB toolboxes script polygon layouts; IPKISS scripts parameterized ones.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="195.84" transform="rotate(-0 68.4 195.84)">Commercial: Cadence Virtuoso, Mentor Pyxis, Synopsys IC Compiler, Tanner LEdit, others.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="227.52" transform="rotate(-0 68.4 227.52)">Layout includes verification: design rule checks, litho simulation, layout vs schematic.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="259.2" transform="rotate(-0 68.4 259.2)">Book flow (esp. Sec. 10.1): Pyxis for schematic + layout, Eldo for electronic modelling.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="290.88" transform="rotate(-0 68.4 290.88)">Calibre (Mentor): physical verification, design for manufacturing, 3D-IC integration.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #30d158" x="46.8" y="362.16" transform="rotate(-0 46.8 362.16)">Takeaway: several tools offer a comprehensive solution; the book's flow uses Mentor tools.</text>
   </g>
  </g>
 </g>
