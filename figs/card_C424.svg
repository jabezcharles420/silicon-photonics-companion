   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="28.8" y="39.809709" transform="rotate(-0 28.8 39.809709)">C424 · Why automate: the case for an automated probe station</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #a1a1a6" x="28.8" y="58.711456" transform="rotate(-0 28.8 58.711456)">Chapter 12 — Testing and packaging · Sec. 12.2 Automated optical probe stations (book p. 389)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="101.603883" transform="rotate(-0 68.4 101.603883)">Wafer-scale tests before dicing pick only in-spec chips for packaging, improving yield.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="139.407379" transform="rotate(-0 68.4 139.407379)">Device research and library building need automation, especially with many variations.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="177.210874" transform="rotate(-0 68.4 177.210874)">Testing many devices across wafers and dies shows process stability and device yield.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="215.014369" transform="rotate(-0 68.4 215.014369)">Auto-alignment and probing help system experiments, particularly before packaging.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="252.817864" transform="rotate(-0 68.4 252.817864)">The station uses a fibre array; several were built, e.g. ThorLabs, PI miCos hardware.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="290.621359" transform="rotate(-0 68.4 290.621359)">Benefits: auto-alignment (over 2000 devices/day), active photonic + electronic tests.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; fill: #30d158" transform="translate(46.8 352.078574)">Takeaway: automation makes large-scale testing practical; this station was designed</text>
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; fill: #30d158" transform="translate(46.8 368.79477)">for lowest cost without compromising insertion loss, stability or repeatability.</text>
   </g>
  </g>
 </g>
