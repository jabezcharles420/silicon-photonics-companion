   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="28.8" y="40.922449" transform="rotate(-0 28.8 40.922449)">C464 · Book index (subject index)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #a1a1a6" x="28.8" y="60.788571" transform="rotate(-0 28.8 60.788571)">Back matter — Index (book pp. 414–418)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="105.869388" transform="rotate(-0 68.4 105.869388)">A subject index of the whole book, A to Z: from “absorption” to “yield”.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="145.601633" transform="rotate(-0 68.4 145.601633)">Page numbers refer to the printed book’s page numbering.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="185.333878" transform="rotate(-0 68.4 185.333878)">Bold headings are topics; indented sub-entries narrow a topic down to one aspect.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="225.066122" transform="rotate(-0 68.4 225.066122)">Big topics carry many sub-entries, e.g. “grating coupler” (Bragg condition, FDTD, mask layout …).</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="264.798367" transform="rotate(-0 68.4 264.798367)">“see X” sends you to the entry that holds the pages; “see also” adds related ones.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="304.530612" transform="rotate(-0 68.4 304.530612)">A page range (e.g. “69–75”) means the topic runs over those pages.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #f6f6f6" x="68.4" y="344.262857" transform="rotate(-0 68.4 344.262857)">The longest entry, “waveguide”, runs onto the next page as “waveguide (cont.)”.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #30d158" x="46.8" y="411.502041" transform="rotate(-0 46.8 411.502041)">Takeaway: look up a term, note its book page, then open the section that covers that page.</text>
   </g>
  </g>
 </g>
